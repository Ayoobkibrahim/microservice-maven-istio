apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: microservices-jwt
  namespace: microservices
spec:
  selector:
    matchLabels:
      app: user-service
  jwtRules:
    - issuer: "auth.example.com"
      jwksUri: "http://auth-service.microservices.svc.cluster.local/.well-known/jwks.json"
