apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: product-retries
  namespace: microservices
spec:
  hosts:
    - product-service
  http:
    - retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: connect-failure,refused-stream,503
      route:
        - destination:
            host: product-service
